appId: net.driftprotocol.app
productName: Hunter Protocol
copyright: © Hunter Protocol

directories:
  output: release
  buildResources: build   # put icon.png (1024x1024) / icon.ico / icon.icns here

# What gets packaged into the app (the Vite build + the Electron shell).
files:
  - dist/**/*
  - electron/**/*
  - package.json

# OS-level deep link: driftpilot://auth-callback (Supabase auth redirects)
protocols:
  - name: Hunter Protocol
    schemes: [driftpilot]

# Auto-update + release hosting via GitHub Releases (free).
publish:
  provider: github
  owner: edgernr
  repo: hunter-protocol
  releaseType: release   # publish directly (not draft) so all 3 OS jobs target the same release type

linux:
  target: [AppImage, deb]
  category: Education
  maintainer: Hunter Protocol
  synopsis: Gamified coding academy — learn, build, earn.

win:
  target: [nsis]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

mac:
  target: [zip]   # zip avoids the CI hdiutil/.dmg failure AND is what macOS auto-update requires; re-add dmg once hdiutil is sorted
  category: public.app-category.education
  # hardenedRuntime + notarization require an Apple Developer account — see DESKTOP.md.
